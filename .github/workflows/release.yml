name: Release CIU

# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to check the build without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # the release job creates a release and uploads to it

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the other: a half-finished
      # release is more useful than none, and the logs from both are what
      # make the failure diagnosable.
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            label: macos-arm64
            artifact: ciu-macos-arm64
          - os: windows-latest
            label: windows-x64
            artifact: ciu-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Build
        run: pyinstaller packaging/ciu.spec --noconfirm

      # The build succeeding says nothing about whether the bundle is
      # complete: a missing data file or a lazily-imported module fails at
      # runtime, in front of a user. This is the gate.
      - name: Self-test the binary (macOS)
        if: runner.os == 'macOS'
        run: ./dist/ciu --selftest

      - name: Self-test the binary (Windows)
        if: runner.os == 'Windows'
        run: .\dist\ciu.exe --selftest

      - name: Stage the package
        shell: bash
        run: |
          mkdir -p stage
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in refs/*|"") VERSION="0.0.0-dev" ;; esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/ciu.exe stage/
            cp packaging/FIRST-RUN-windows.txt stage/FIRST-RUN.txt
          else
            # The .app is what the user drags to Applications. Its executable
            # hands the real binary to Terminal, so the log stays visible and
            # closing the window still stops CIU.
            sh packaging/make_app.sh dist/ciu stage/CIU.app "$VERSION"
            cp packaging/FIRST-RUN-macos.txt stage/FIRST-RUN.txt
          fi
          cp README.md stage/ 2>/dev/null || true
          ls -la stage

      # zip on macOS preserves the executable bit; Compress-Archive on
      # Windows does not need to, because .exe does not depend on one.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent stage ${{ matrix.artifact }}.zip

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path stage\* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish whatever built. One platform failing should still get the other
    # into people's hands, with the gap visible rather than the whole release
    # withheld.
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release
          test -n "$(ls -A release)" || { echo "no artifacts built"; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
          path: src

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CIU ${GITHUB_REF_NAME}" \
            --notes-file src/packaging/RELEASE_NOTES.md
